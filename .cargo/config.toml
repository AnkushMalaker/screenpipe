[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]

# Force M1 target for all ARM64 macOS builds
# This prevents whisper.cpp from using i8mm instructions that only M2+ chips have
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "target-cpu=apple-m1",
    "-C", "link-arg=-framework",
    "-C", "link-arg=Accelerate",
    "-l", "c++",
]

[target.x86_64-apple-darwin]
rustflags = "-lc++ -l framework=Accelerate"

[env]
# Use prebuilt NASM objects on Windows (no NASM install needed in CI): https://aws.github.io/aws-lc-rs/requirements/windows.html#prebuilt-nasm-objects
AWS_LC_SYS_PREBUILT_NASM = "1"
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# SQLite's official page-level recovery API requires sqlite_dbpage. Compile it
# into the already-bundled SQLite library so recovery never depends on a host
# `sqlite3` executable or platform package manager.
LIBSQLITE3_FLAGS = "SQLITE_ENABLE_DBPAGE_VTAB"
# antirez-asr-sys compiles its qwen-asr C sources with -std=c11, which puts
# glibc in strict-ANSI mode and hides POSIX `strdup`. GCC 14 promoted implicit
# function declarations from a warning to an error, so on a modern toolchain
# (GCC 16 here) the build dies with "implicit declaration of function 'strdup'".
# Upstream CI runs an older GCC and never sees it. _GNU_SOURCE re-exposes the
# POSIX declarations without changing the -std the crate asked for.
#
# The same block exists in apps/screenpipe-app-tauri/src-tauri/.cargo/config.toml.
# Cargo reads the config of the directory it is invoked from, so the app build
# (install-local.sh, run from src-tauri/) and a workspace-root build of the
# `screenpipe` CLI need it independently — fixing only one leaves the other
# broken on any GCC 14+ host.
# Target-scoped so macOS builds are untouched; cc-rs reads CFLAGS_<target>
# before the generic CFLAGS.
CFLAGS_x86_64_unknown_linux_gnu = { value = "-D_GNU_SOURCE", force = false }

# Cargo already uses the machine's available parallelism. A fixed value made
# 10-core developer machines run 16 compiler processes at once, increasing
# memory pressure and making cold builds slower. Keep this adaptive so
# concurrent worktrees also divide the machine's resources more gracefully.
